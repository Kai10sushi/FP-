<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">「治療を受ける」と「休業中の生活を支える」。</title><desc id="desc">同じ健康保険の中でも、給付の役割と条件は違います。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">08 / 使い方①｜医療保険</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">「治療を受ける」と「休業中の生活を支える」。</text><text x="67" y="192" font-size="24" fill="#627373" >同じ健康保険の中でも、給付の役割と条件は違います。</text><rect x="65" y="250" width="570" height="460" rx="20" fill="#e1efeb"/><g transform="translate(116 371) scale(1.15)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><text x="329" y="348" font-size="29" fill="#173c42" >業務外の</text><text x="329" y="392" font-size="34" fill="#173c42" >病気・けが</text><text x="329" y="488" font-size="28" fill="#173c42" >病院で治療</text><text x="329" y="583" font-size="28" fill="#173c42" >仕事を休む</text><path d="M641 432 H738" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><path d="M641 599 H738" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="760" y="250" width="775" height="210" rx="20" fill="#fff"/><text x="794" y="300" font-size="31" fill="#267e83" >治療費への保障</text><text x="794" y="352" font-size="29" fill="#173c42" >保険診療の費用の一部を保険が負担</text><text x="794" y="414" font-size="25" fill="#173c42" >自己負担が高額なら、高額療養費も確認</text><rect x="760" y="487" width="775" height="223" rx="20" fill="#fff"/><text x="794" y="537" font-size="31" fill="#267e83" >収入減への保障：傷病手当金</text><text x="794" y="588" font-size="26" fill="#173c42" >療養で働けず、十分な給与がない場合など</text><text x="794" y="638" font-size="26" fill="#173c42" >連続3日の待期後、4日目以降が対象</text><text x="794" y="677" font-size="21" fill="#627373" >※ その他の支給条件も確認が必要</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">まずは自分が加入している健康保険の窓口へ確認。</text><text x="65" y="862" font-size="18" fill="#627373" >会社員の健康保険の例です。傷病手当金は治療費の払戻しや一律の入院日額給付ではありません。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">08</text></g></svg>
