<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">関係する制度がわかったら、窓口へ確認。</title><desc id="desc">医療・年金・介護・労働の4分野に、確認する入口があります。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">09 / 社会保険の使い方</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">関係する制度がわかったら、窓口へ確認。</text><text x="67" y="192" font-size="24" fill="#627373" >医療・年金・介護・労働の4分野に、確認する入口があります。</text><text x="91" y="250" font-size="21" fill="#627373" >困りごと</text><text x="670" y="250" font-size="21" fill="#627373" >関係する保険</text><text x="1022" y="250" font-size="21" fill="#627373" >主な確認先</text><rect x="65" y="268" width="490" height="75" rx="18" fill="#fff"/><text x="90" y="315" font-size="26" fill="#173c42" >治療費・病気による休業</text><path d="M571 306 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="268" width="254" height="75" rx="18" fill="#e1efeb"/><text x="775" y="315" font-size="28" fill="#173c42" text-anchor="middle">医療保険</text><path d="M920 306 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="268" width="538" height="75" rx="18" fill="#e1efeb"/><text x="1019" y="315" font-size="28" fill="#173c42" >加入している医療保険の窓口</text><rect x="65" y="355" width="490" height="75" rx="18" fill="#fff"/><text x="90" y="402" font-size="26" fill="#173c42" >老後・障害・遺族の年金</text><path d="M571 393 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="355" width="254" height="75" rx="18" fill="#eee8f4"/><text x="775" y="402" font-size="28" fill="#173c42" text-anchor="middle">年金保険</text><path d="M920 393 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="355" width="538" height="75" rx="18" fill="#eee8f4"/><text x="1019" y="402" font-size="28" fill="#173c42" >年金事務所など</text><rect x="65" y="442" width="490" height="75" rx="18" fill="#fff"/><text x="90" y="489" font-size="26" fill="#173c42" >介護が必要になった</text><path d="M571 480 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="442" width="254" height="75" rx="18" fill="#e7ecdf"/><text x="775" y="489" font-size="28" fill="#173c42" text-anchor="middle">介護保険</text><path d="M920 480 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="442" width="538" height="75" rx="18" fill="#e7ecdf"/><text x="1019" y="489" font-size="25" fill="#173c42" >市区町村・地域包括支援センター</text><rect x="65" y="529" width="490" height="75" rx="18" fill="#fff"/><text x="90" y="576" font-size="26" fill="#173c42" >失業して求職している</text><path d="M571 567 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="529" width="254" height="75" rx="18" fill="#f3e7d4"/><text x="775" y="576" font-size="28" fill="#173c42" text-anchor="middle">雇用保険</text><path d="M920 567 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="529" width="538" height="75" rx="18" fill="#f3e7d4"/><text x="1019" y="576" font-size="28" fill="#173c42" >ハローワーク</text><rect x="65" y="616" width="490" height="75" rx="18" fill="#fff"/><text x="90" y="663" font-size="26" fill="#173c42" >仕事・通勤によるけが</text><path d="M571 654 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="616" width="254" height="75" rx="18" fill="#f3e7d4"/><text x="775" y="663" font-size="28" fill="#173c42" text-anchor="middle">労災保険</text><path d="M920 654 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="616" width="538" height="75" rx="18" fill="#f3e7d4"/><text x="1019" y="663" font-size="28" fill="#173c42" >労働基準監督署など</text><text x="76" y="733" font-size="22" fill="#627373" >医療保険の窓口の例：協会けんぽ・健康保険組合・市区町村の国保担当など</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">窓口では、自分の状況を伝え、対象・必要書類・期限を確認する。</text><text x="65" y="862" font-size="18" fill="#627373" >主な相談先です。給付の有無・条件・窓口は加入先等で異なります。雇用保険と労災保険を合わせて労働保険と呼びます。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">09</text></g></svg>
