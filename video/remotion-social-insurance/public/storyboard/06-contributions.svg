<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">負担は、全員が同じ金額とは限らない。</title><desc id="desc">所得や給与に応じた負担、軽減制度などが設けられている。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">06 / メリット③</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">負担は、全員が同じ金額とは限らない。</text><text x="67" y="192" font-size="24" fill="#627373" >所得や給与に応じた負担、軽減制度などが設けられている。</text><rect x="65" y="247" width="920" height="467" rx="20" fill="#fff"/><text x="98" y="297" font-size="29" fill="#173c42" >例：会社員の健康保険・厚生年金</text><text x="100" y="358" font-size="24" fill="#173c42" >給与など</text><rect x="305" y="326" width="270" height="45" rx="7" fill="#a4cfc0"/><text x="594" y="359" font-size="23" fill="#173c42" >計算の基礎へ</text><text x="100" y="452" font-size="24" fill="#173c42" >給与など</text><rect x="305" y="420" width="500" height="45" rx="7" fill="#267e83"/><path d="M435 477 V522" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="240" y="539" width="575" height="87" rx="13" fill="#e1efeb"/><text x="527" y="591" font-size="26" fill="#173c42" text-anchor="middle">標準報酬などをもとに保険料を計算</text><text x="100" y="677" font-size="21" fill="#627373" >※ 棒は概念図。実際の比率・金額を示しません。</text><rect x="1020" y="247" width="515" height="467" rx="20" fill="#e7ecdf"/><text x="1053" y="302" font-size="29" fill="#173c42" >ただし、制度ごとに違う</text><text x="1053" y="376" font-size="25" fill="#173c42" >・計算には上限などがある</text><text x="1053" y="438" font-size="25" fill="#173c42" >・国民年金は原則定額</text><text x="1053" y="500" font-size="24" fill="#173c42" >・国保には所得基準に応じた</text><text x="1075" y="539" font-size="24" fill="#173c42" >保険料の軽減制度がある</text><text x="1053" y="621" font-size="24" fill="#173c42" >資産の多さだけで一律に</text><text x="1053" y="658" font-size="24" fill="#173c42" >決まる仕組みではありません。</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">「全員一律」でも「すべて所得比例」でもない。</text><text x="65" y="862" font-size="18" fill="#627373" >出典：日本年金機構「厚生年金保険の保険料」／厚生労働省「国民健康保険の保険料・保険税について」</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">06</text></g></svg>
