<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">毎月引かれる、このお金。何を支えている？</title><desc id="desc">給与明細にある「社会保険料」から、暮らしとのつながりを見てみよう。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">01 / 導入</text><text x="65" y="146" font-size="48" fill="#173c42" font-weight="bold">毎月引かれる、このお金。何を支えている？</text><text x="67" y="192" font-size="24" fill="#627373" >給与明細にある「社会保険料」から、暮らしとのつながりを見てみよう。</text><rect x="65" y="238" width="550" height="545" rx="28" fill="#e5eeea"/><rect x="99" y="271" width="464" height="129" rx="20" fill="#fff"/><text x="132" y="322" font-size="28" fill="#173c42" >手取りは気になるけど…</text><text x="132" y="368" font-size="30" fill="#173c42" font-weight="bold">この保険料は何のため？</text><path d="M239 400 L265 430 L287 400" fill="#fff"/><g transform="translate(260 436) scale(1.4)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><rect x="135" y="691" width="395" height="54" rx="12" fill="#fff"/><text x="332" y="727" font-size="24" fill="#267e83" text-anchor="middle">会社員の、身近な疑問</text><rect x="722" y="238" width="810" height="545" rx="20" fill="#fff"/><text x="765" y="294" font-size="32" fill="#173c42" font-weight="bold">給与明細</text><text x="1486" y="293" font-size="18" fill="#627373" text-anchor="end">イメージ・金額省略</text><path d="M762 320 H1490" stroke="#d8e0dc" stroke-width="2"/><text x="777" y="366" font-size="25" fill="#173c42" >支給額</text><text x="1455" y="366" font-size="26" fill="#627373" text-anchor="end">○○○,○○○ 円</text><rect x="749" y="402" width="755" height="200" rx="15" fill="#e3f2ed"/><rect x="749" y="402" width="755" height="200" rx="15" fill="none" stroke="#267e83" stroke-width="3"/><text x="780" y="444" font-size="29" fill="#267e83" font-weight="bold">社会保険料</text><text x="797" y="492" font-size="24" fill="#173c42" >健康保険料</text><text x="1169" y="492" font-size="24" fill="#173c42" >厚生年金保険料</text><text x="797" y="546" font-size="24" fill="#173c42" >雇用保険料</text><text x="1169" y="546" font-size="24" fill="#173c42" >介護保険料 ※</text><text x="780" y="584" font-size="17" fill="#627373" >※ 対象者の場合。明細の表示方法は勤務先により異なります。</text><text x="777" y="652" font-size="24" fill="#173c42" >税金など</text><text x="1455" y="652" font-size="25" fill="#627373" text-anchor="end">○○,○○○ 円</text><rect x="749" y="686" width="755" height="65" rx="12" fill="#173c42"/><text x="783" y="730" font-size="26" fill="#fff" >差引支給額（手取り）</text><text x="1455" y="730" font-size="27" fill="#fff" text-anchor="end">○○○,○○○ 円</text><path d="M575 505 H730" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><text x="65" y="862" font-size="18" fill="#627373" >画面デザイン案｜労災保険料は給与から引かれる項目として表示しません。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">01</text></g></svg>
