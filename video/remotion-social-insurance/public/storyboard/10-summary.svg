<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">給与明細の向こうに、暮らしを支える仕組み。</title><desc id="desc">社会保険は、生活のリスクを社会で支え合う制度です。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">10 / まとめ</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">給与明細の向こうに、暮らしを支える仕組み。</text><text x="67" y="192" font-size="24" fill="#627373" >社会保険は、生活のリスクを社会で支え合う制度です。</text><rect x="65" y="249" width="590" height="472" rx="20" fill="#e1efeb"/><g transform="translate(90 385) scale(1.3)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><rect x="315" y="314" width="302" height="277" rx="20" fill="#fff"/><text x="345" y="362" font-size="28" fill="#173c42" >給与明細</text><path d="M345 381 H585" stroke="#d4dfdb" stroke-width="3"/><rect x="335" y="407" width="261" height="78" rx="10" fill="#267e83"/><text x="466" y="456" font-size="30" fill="#fff" text-anchor="middle">社会保険料</text><text x="345" y="549" font-size="26" fill="#173c42" >毎月の負担</text><path d="M677 474 H789" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="815" y="249" width="720" height="472" rx="20" fill="#fff"/><text x="851" y="307" font-size="34" fill="#267e83" >医療・年金・介護・労働</text><text x="851" y="379" font-size="32" fill="#173c42" >必要なときの支えになる</text><text x="851" y="439" font-size="28" fill="#173c42" >ただし、条件と保障の限界がある</text><rect x="846" y="484" width="657" height="191" rx="16" fill="#e7ecdf"/><text x="875" y="531" font-size="24" fill="#63815a" >今日の一歩</text><text x="875" y="579" font-size="28" fill="#173c42" >自分に関係する制度を一つ選び、</text><text x="875" y="624" font-size="29" fill="#173c42" >公式の窓口で確認しよう。</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">各制度は、このチャンネルで順次詳しく解説します。</text><text x="65" y="862" font-size="18" fill="#627373" >全体像をつかむための解説です。個別の加入・受給判断は、加入先や担当窓口に確認してください。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">10</text></g></svg>
