<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">困ったときは、この3ステップで確認しよう。</title><desc id="desc">制度を知るだけでなく、自分が使える保障と必要な手続きにつなげる。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">08 / 社会保険の使い方</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">困ったときは、この3ステップで確認しよう。</text><text x="67" y="192" font-size="24" fill="#627373" >制度を知るだけでなく、自分が使える保障と必要な手続きにつなげる。</text><rect x="65" y="247" width="450" height="454" rx="18" fill="#fff"/><rect x="88" y="273" width="63" height="40" rx="10" fill="#267e83"/><text x="119" y="302" font-size="22" fill="#fff" text-anchor="middle">01</text><text x="90" y="356" font-size="31" fill="#173c42" font-weight="bold">困りごとを整理</text><rect x="575" y="247" width="450" height="454" rx="18" fill="#fff"/><rect x="598" y="273" width="63" height="40" rx="10" fill="#267e83"/><text x="629" y="302" font-size="22" fill="#fff" text-anchor="middle">02</text><text x="600" y="356" font-size="31" fill="#173c42" font-weight="bold">関係する制度を探す</text><rect x="1085" y="247" width="450" height="454" rx="18" fill="#fff"/><rect x="1108" y="273" width="63" height="40" rx="10" fill="#267e83"/><text x="1139" y="302" font-size="22" fill="#fff" text-anchor="middle">03</text><text x="1110" y="356" font-size="31" fill="#173c42" font-weight="bold">条件・手続きを確認</text><rect x="94" y="385" width="391" height="79" rx="12" fill="#e1efeb"/><text x="115" y="418" font-size="25" fill="#173c42" >治療費が心配？</text><text x="115" y="449" font-size="25" fill="#173c42" >働けず収入が減った？</text><path d="M169 464 L192 487 L211 464" fill="#e1efeb"/><circle cx="161" cy="535" r="25" fill="#f0c5a4"/><path d="M135 533 Q129 499 160 505 Q194 501 188 536 L177 521 L142 523Z" fill="#233d45"/><path d="M121 611 Q118 564 161 564 Q204 564 202 611Z" fill="#267e83"/><text x="226" y="541" font-size="25" fill="#173c42" >介護が必要？</text><text x="226" y="582" font-size="23" fill="#173c42" >何に困っているか</text><text x="95" y="661" font-size="24" fill="#173c42" >まず、自分の状況を言葉にする</text><rect x="604" y="392" width="180" height="63" rx="12" fill="#e1efeb"/><text x="632" y="434" font-size="26" fill="#173c42" >医療保険</text><rect x="802" y="392" width="192" height="63" rx="12" fill="#eee8f4"/><text x="834" y="434" font-size="26" fill="#173c42" >年金保険</text><rect x="604" y="474" width="180" height="63" rx="12" fill="#e7ecdf"/><text x="632" y="516" font-size="26" fill="#173c42" >介護保険</text><rect x="802" y="474" width="192" height="63" rx="12" fill="#f3e7d4"/><text x="834" y="516" font-size="26" fill="#173c42" >労働保険</text><text x="604" y="586" font-size="22" fill="#627373" >労働保険＝雇用保険＋労災保険</text><text x="604" y="633" font-size="25" fill="#173c42" >一つの困りごとに、</text><text x="604" y="671" font-size="25" fill="#173c42" >複数の保障が関係することも</text><rect x="1116" y="387" width="25" height="25" rx="4" fill="#e1efeb"/><path d="M1120 400 l6 6 l11 -15" fill="none" stroke="#267e83" stroke-width="3"/><text x="1160" y="409" font-size="25" fill="#173c42" >自分は対象になる？</text><rect x="1116" y="457" width="25" height="25" rx="4" fill="#e1efeb"/><path d="M1120 470 l6 6 l11 -15" fill="none" stroke="#267e83" stroke-width="3"/><text x="1160" y="479" font-size="25" fill="#173c42" >どんな条件がある？</text><rect x="1116" y="527" width="25" height="25" rx="4" fill="#e1efeb"/><path d="M1120 540 l6 6 l11 -15" fill="none" stroke="#267e83" stroke-width="3"/><text x="1160" y="549" font-size="25" fill="#173c42" >書類・申請先・期限は？</text><text x="1115" y="632" font-size="25" fill="#173c42" >加入先や担当窓口で確認</text><text x="1115" y="672" font-size="25" fill="#173c42" >必要な手続きへ進む</text><path d="M527 476 H563" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><path d="M1037 476 H1073" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="65" y="738" width="1470" height="72" rx="12" fill="#173c42"/><text x="800" y="785" font-size="29" fill="#fff" text-anchor="middle">詳しい申請方法を全部覚えるより、まず確認する順序を知ろう。</text><text x="65" y="862" font-size="18" fill="#627373" >手続きの入口を示す一般的な流れです。加入・給付条件や必要な申請は制度ごとに異なります。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">08</text></g></svg>
