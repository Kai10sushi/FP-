<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">大きな負担を、一人だけで抱え込まない。</title><desc id="desc">リスク分散：いつ誰に起きるかわからない負担に、みんなで備える。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">04 / メリット①</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">大きな負担を、一人だけで抱え込まない。</text><text x="67" y="192" font-size="24" fill="#627373" >リスク分散：いつ誰に起きるかわからない負担に、みんなで備える。</text><rect x="65" y="245" width="580" height="470" rx="20" fill="#efe4d8"/><text x="355" y="297" font-size="30" fill="#173c42" text-anchor="middle">一人の備えだけでは</text><rect x="195" y="339" width="320" height="78" rx="15" fill="#b47c36"/><text x="355" y="389" font-size="28" fill="#fff" text-anchor="middle">突然の大きな負担</text><path d="M355 429 V471 M335 452 L355 474 L375 452" stroke="#b47c36" stroke-width="7" fill="none"/><g transform="translate(285 483) scale(0.83)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><text x="115" y="688" font-size="25" fill="#173c42" >貯蓄が十分でないこともある</text><path d="M665 487 H743" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="765" y="245" width="770" height="470" rx="20" fill="#e1efeb"/><text x="1150" y="297" font-size="30" fill="#173c42" text-anchor="middle">社会保険でも支える</text><rect x="991" y="334" width="325" height="77" rx="15" fill="#267e83"/><text x="1153" y="383" font-size="26" fill="#fff" text-anchor="middle">制度を通じて支える</text><g transform="translate(832 491) scale(0.65)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><path d="M877 477 L1149 424" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><g transform="translate(1007 491) scale(0.65)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#7e709f"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#7e709f" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><path d="M1052 477 L1149 424" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><g transform="translate(1182 491) scale(0.65)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#b47c36"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#b47c36" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><path d="M1227 477 L1149 424" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><g transform="translate(1357 491) scale(0.65)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#63815a"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#63815a" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><path d="M1402 477 L1149 424" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><text x="1150" y="688" font-size="26" fill="#173c42" text-anchor="middle">必要なとき、条件に応じた保障へ</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">貯蓄の代わりではなく、貯蓄だけでは難しいリスクにも備える。</text><text x="65" y="862" font-size="18" fill="#627373" >仕組みの概念図です。給付額が一定、損失の全額を補償、という意味ではありません。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">04</text></g></svg>
