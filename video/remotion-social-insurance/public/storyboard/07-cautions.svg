<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">保障がある一方で、負担・条件・限界もある。</title><desc id="desc">加入していれば、どんな場合も全額受け取れるわけではありません。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">07 / デメリット・注意点</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">保障がある一方で、負担・条件・限界もある。</text><text x="67" y="192" font-size="24" fill="#627373" >加入していれば、どんな場合も全額受け取れるわけではありません。</text><rect x="65" y="248" width="470" height="464" rx="20" fill="#fff"/><text x="93" y="302" font-size="28" fill="#173c42" >① 保険料の負担</text><rect x="95" y="339" width="410" height="66" rx="12" fill="#e1efeb"/><text x="300" y="382" font-size="24" fill="#173c42" text-anchor="middle">給与など</text><path d="M300 417 V445" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="95" y="464" width="255" height="95" rx="12" fill="#e1efeb"/><rect x="360" y="464" width="145" height="95" rx="12" fill="#e8d6ba"/><text x="223" y="520" font-size="23" fill="#173c42" text-anchor="middle">家計で使えるお金</text><text x="433" y="520" font-size="23" fill="#173c42" text-anchor="middle">保険料</text><text x="300" y="641" font-size="24" fill="#173c42" text-anchor="middle">利用しない期間にも</text><text x="300" y="678" font-size="24" fill="#173c42" text-anchor="middle">負担がある</text><rect x="565" y="248" width="470" height="464" rx="20" fill="#fff"/><text x="593" y="302" font-size="28" fill="#173c42" >② 加入・給付の条件</text><rect x="595" y="339" width="410" height="66" rx="12" fill="#eee8f4"/><text x="800" y="382" font-size="24" fill="#173c42" text-anchor="middle">加入対象を確認</text><path d="M800 417 V441" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="595" y="453" width="410" height="60" rx="12" fill="#eee8f4"/><text x="800" y="493" font-size="24" fill="#173c42" text-anchor="middle">給付の条件を確認</text><path d="M800 523 V542" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><text x="800" y="584" font-size="24" fill="#173c42" text-anchor="middle">申請・審査へ</text><text x="800" y="641" font-size="24" fill="#173c42" text-anchor="middle">加入していることと</text><text x="800" y="678" font-size="24" fill="#173c42" text-anchor="middle">受給できることは別</text><rect x="1065" y="248" width="470" height="464" rx="20" fill="#fff"/><text x="1093" y="302" font-size="28" fill="#173c42" >③ 保障範囲の限界</text><rect x="1095" y="339" width="410" height="66" rx="12" fill="#f3e7d4"/><text x="1300" y="382" font-size="24" fill="#173c42" text-anchor="middle">必要な費用・収入</text><path d="M1300 417 V445" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="1095" y="464" width="245" height="95" rx="12" fill="#e1efeb"/><rect x="1350" y="464" width="155" height="95" rx="12" fill="#e8d6ba"/><text x="1217" y="520" font-size="23" fill="#173c42" text-anchor="middle">制度による保障</text><text x="1427" y="520" font-size="23" fill="#173c42" text-anchor="middle">残る負担</text><text x="1300" y="641" font-size="24" fill="#173c42" text-anchor="middle">支給額・対象・期間などに</text><text x="1300" y="678" font-size="24" fill="#173c42" text-anchor="middle">限りがある</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">保険料だけで判断せず、受けられる保障と残る負担を確認する。</text><text x="65" y="862" font-size="18" fill="#627373" >図の面積は実際の金額・割合を表しません。加入・給付の要件、自己負担などは制度ごとに異なります。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">07</text></g></svg>
