<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">困ったとき、最初にどこへ確認する？</title><desc id="desc">制度名を覚えるだけでなく、相談する入口までつなげよう。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">09 / 使い方②｜年金・介護・労働</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">困ったとき、最初にどこへ確認する？</text><text x="67" y="192" font-size="24" fill="#627373" >制度名を覚えるだけでなく、相談する入口までつなげよう。</text><rect x="65" y="251" width="490" height="94" rx="20" fill="#fff"/><text x="88" y="310" font-size="26" fill="#173c42" >老後・障害・遺族の年金</text><path d="M571 298 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="251" width="254" height="94" rx="14" fill="#eee8f4"/><text x="775" y="310" font-size="28" fill="#173c42" text-anchor="middle">年金保険</text><path d="M920 298 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="251" width="538" height="94" rx="14" fill="#eee8f4"/><text x="1019" y="310" font-size="28" fill="#173c42" >年金事務所など</text><rect x="65" y="366" width="490" height="94" rx="20" fill="#fff"/><text x="88" y="425" font-size="26" fill="#173c42" >介護が必要になった</text><path d="M571 413 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="366" width="254" height="94" rx="14" fill="#e7ecdf"/><text x="775" y="425" font-size="28" fill="#173c42" text-anchor="middle">介護保険</text><path d="M920 413 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="366" width="538" height="94" rx="14" fill="#e7ecdf"/><text x="1019" y="425" font-size="28" fill="#173c42" >市区町村・地域包括支援センター</text><rect x="65" y="481" width="490" height="94" rx="20" fill="#fff"/><text x="88" y="540" font-size="26" fill="#173c42" >失業して求職している</text><path d="M571 528 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="481" width="254" height="94" rx="14" fill="#f3e7d4"/><text x="775" y="540" font-size="28" fill="#173c42" text-anchor="middle">雇用保険</text><path d="M920 528 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="481" width="538" height="94" rx="14" fill="#f3e7d4"/><text x="1019" y="540" font-size="28" fill="#173c42" >ハローワーク</text><rect x="65" y="596" width="490" height="94" rx="20" fill="#fff"/><text x="88" y="655" font-size="26" fill="#173c42" >仕事・通勤によるけが</text><path d="M571 643 H625" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="648" y="596" width="254" height="94" rx="14" fill="#f3e7d4"/><text x="775" y="655" font-size="28" fill="#173c42" text-anchor="middle">労災保険</text><path d="M920 643 H975" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="997" y="596" width="538" height="94" rx="14" fill="#f3e7d4"/><text x="1019" y="655" font-size="28" fill="#173c42" >労働基準監督署など</text><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">自分の状況を伝え、対象・必要書類・手続きの期限を確認。</text><text x="65" y="862" font-size="18" fill="#627373" >主な相談先です。給付の種類・加入先により窓口は異なります。勤務先の担当者にも状況を共有しましょう。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">09</text></g></svg>
