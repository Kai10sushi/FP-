<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">一人では抱えきれない負担を、社会で支える。</title><desc id="desc">保険料などをもとに、必要なときの医療や暮らしを支える仕組み。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">02 / 社会保険の目的</text><text x="65" y="146" font-size="48" fill="#173c42" font-weight="bold">一人では抱えきれない負担を、社会で支える。</text><text x="67" y="192" font-size="24" fill="#627373" >保険料などをもとに、必要なときの医療や暮らしを支える仕組み。</text><rect x="65" y="247" width="385" height="477" rx="25" fill="#e5eeea"/><text x="257" y="298" font-size="28" fill="#173c42" text-anchor="middle" font-weight="bold">支える人・事業主</text><g transform="translate(94 346) scale(0.83)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><g transform="translate(208 332) scale(0.92)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#c18947"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#c18947" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><g transform="translate(326 346) scale(0.83)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#7e709f"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#7e709f" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><text x="257" y="597" font-size="25" fill="#173c42" text-anchor="middle">加入者の保険料</text><text x="257" y="638" font-size="25" fill="#173c42" text-anchor="middle">事業主の負担など</text><rect x="611" y="340" width="352" height="293" rx="26" fill="#173c42"/><text x="787" y="405" font-size="31" fill="#fff" text-anchor="middle" font-weight="bold">社会保険の仕組み</text><path d="M745 446 L787 428 L829 446 V486 Q829 526 787 545 Q745 526 745 486 Z" fill="#9acdc0"/><path d="M769 485 L783 499 L808 467" fill="none" stroke="#173c42" stroke-width="7"/><text x="787" y="587" font-size="23" fill="#dfebe6" text-anchor="middle">制度ごとに運営</text><path d="M464 470 H595" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><text x="529" y="424" font-size="23" fill="#267e83" text-anchor="middle">負担する</text><path d="M978 470 H1112" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><text x="1043" y="424" font-size="23" fill="#267e83" text-anchor="middle">支える</text><rect x="1128" y="247" width="407" height="477" rx="20" fill="#fff"/><text x="1331" y="298" font-size="28" fill="#173c42" text-anchor="middle" font-weight="bold">支援が必要なとき</text><rect x="1157" y="335" width="350" height="95" rx="13" fill="#e4f2f0"/><text x="1183" y="376" font-size="27" fill="#173c42" >病気・けが</text><text x="1183" y="411" font-size="22" fill="#627373" >治療などを支える</text><rect x="1157" y="449" width="350" height="95" rx="13" fill="#eee9f6"/><text x="1183" y="490" font-size="27" fill="#173c42" >老後・障害など</text><text x="1183" y="525" font-size="22" fill="#627373" >所得を支える</text><rect x="1157" y="563" width="350" height="95" rx="13" fill="#f5ead8"/><text x="1183" y="604" font-size="27" fill="#173c42" >介護・失業など</text><text x="1183" y="639" font-size="22" fill="#627373" >生活を支える</text><rect x="612" y="251" width="350" height="54" rx="10" fill="#e1e6dc"/><text x="787" y="287" font-size="22" fill="#173c42" text-anchor="middle">制度により公費（税金）も</text><path d="M787 308 V333" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><rect x="65" y="750" width="1470" height="58" rx="12" fill="#e3e9e3"/><text x="800" y="789" font-size="30" fill="#173c42" text-anchor="middle" font-weight="bold">支える側にも、支えられる側にもなる。</text><text x="65" y="862" font-size="18" fill="#627373" >概念図です。財源・負担割合・給付条件は制度ごとに異なり、すべてを一つの基金で運営するわけではありません。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">02</text></g></svg>
