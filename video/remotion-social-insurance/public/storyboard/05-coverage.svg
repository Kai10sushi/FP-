<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">一つの病気だけでなく、暮らしを広く支える。</title><desc id="desc">幅広い保障：生活のさまざまな場面に、関係する制度がある。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">05 / メリット②</text><text x="65" y="146" font-size="46" fill="#173c42" font-weight="bold">一つの病気だけでなく、暮らしを広く支える。</text><text x="67" y="192" font-size="24" fill="#627373" >幅広い保障：生活のさまざまな場面に、関係する制度がある。</text><g transform="translate(672 374) scale(1.55)"><ellipse cx="70" cy="216" rx="66" ry="12" fill="#d7e2df"/><path d="M38 147 L32 213 M102 147 L109 213" stroke="#243f4c" stroke-width="22" stroke-linecap="round"/><path d="M24 144 Q18 73 70 75 Q124 73 116 144 Z" fill="#267e83"/><path d="M32 93 L10 150 M108 93 L130 150" stroke="#267e83" stroke-width="19" stroke-linecap="round"/><circle cx="70" cy="43" r="33" fill="#f0c5a4"/><path d="M37 44 Q27 1 65 6 Q107 0 105 47 L93 25 Q70 38 44 28 Z" fill="#233d45"/><circle cx="59" cy="46" r="2.6" fill="#233d45"/><circle cx="82" cy="46" r="2.6" fill="#233d45"/><path d="M62 60 Q71 66 80 60" fill="none" stroke="#a5664d" stroke-width="2.4"/><path d="M57 79 L70 96 L84 79" fill="#fff"/></g><rect x="65" y="258" width="492" height="180" rx="20" fill="#e1efeb"/><text x="97" y="308" font-size="28" fill="#267e83" >医療保険</text><text x="97" y="365" font-size="32" fill="#173c42" >病気・けがの治療など</text><rect x="1043" y="258" width="492" height="180" rx="20" fill="#eee8f4"/><text x="1075" y="308" font-size="28" fill="#7e709f" >年金保険</text><text x="1075" y="365" font-size="29" fill="#173c42" >老後・障害・遺族の生活</text><rect x="65" y="504" width="492" height="180" rx="20" fill="#e7ecdf"/><text x="97" y="554" font-size="28" fill="#63815a" >介護保険</text><text x="97" y="611" font-size="32" fill="#173c42" >介護が必要な生活</text><rect x="1043" y="504" width="492" height="180" rx="20" fill="#f3e7d4"/><text x="1075" y="554" font-size="28" fill="#b47c36" >労働保険</text><text x="1075" y="611" font-size="29" fill="#173c42" >失業・仕事や通勤の災害</text><path d="M572 349 H686" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><path d="M1028 349 H912" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><path d="M572 594 H686" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><path d="M1028 594 H912" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#a)"/><rect x="65" y="756" width="1470" height="57" rx="12" fill="#173c42"/><text x="800" y="794" font-size="28" fill="#fff" text-anchor="middle">自分の困りごとから、関係する制度を探せる。</text><text x="65" y="862" font-size="18" fill="#627373" >主な保障の例です。加入する制度や年齢などにより、受けられる給付は異なります。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">05</text></g></svg>
