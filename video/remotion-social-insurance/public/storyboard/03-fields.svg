<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">困りごとから、関係する保険を見つけよう。</title><desc id="desc">今回は4分野で整理。労働保険の中に「雇用保険」と「労災保険」があります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#267e83"/></marker></defs><g font-family="'Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f3ec"/><rect x="55" y="40" width="8" height="28" rx="4" fill="#267e83"/><text x="78" y="62" font-size="22" fill="#173c42" >制度の翻訳室</text><text x="1540" y="62" font-size="20" fill="#5b7273" text-anchor="end">03 / 社会保険の全体像</text><text x="65" y="146" font-size="48" fill="#173c42" font-weight="bold">困りごとから、関係する保険を見つけよう。</text><text x="67" y="192" font-size="24" fill="#627373" >今回は4分野で整理。労働保険の中に「雇用保険」と「労災保険」があります。</text><rect x="65" y="247" width="670" height="116" rx="18" fill="#fff"/><rect x="65" y="247" width="8" height="116" rx="4" fill="#267e83"/><text x="106" y="292" font-size="19" fill="#267e83" >通院・入院</text><text x="106" y="335" font-size="29" fill="#173c42" font-weight="bold">病気・けがで治療が必要</text><path d="M755 305 H842" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><rect x="865" y="247" width="670" height="116" rx="18" fill="#e1efeb"/><text x="895" y="294" font-size="30" fill="#267e83" font-weight="bold">医療保険</text><text x="895" y="335" font-size="25" fill="#173c42" >医療費などを支える</text><rect x="65" y="383" width="670" height="116" rx="18" fill="#fff"/><rect x="65" y="383" width="8" height="116" rx="4" fill="#7e709f"/><text x="106" y="428" font-size="19" fill="#7e709f" >暮らしの収入</text><text x="106" y="471" font-size="29" fill="#173c42" font-weight="bold">老後・障害・遺族の生活</text><path d="M755 441 H842" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><rect x="865" y="383" width="670" height="116" rx="18" fill="#eee8f4"/><text x="895" y="430" font-size="30" fill="#7e709f" font-weight="bold">年金保険</text><text x="895" y="471" font-size="25" fill="#173c42" >生活を支える所得の保障</text><rect x="65" y="519" width="670" height="116" rx="18" fill="#fff"/><rect x="65" y="519" width="8" height="116" rx="4" fill="#63815a"/><text x="106" y="564" font-size="19" fill="#63815a" >日常生活の支援</text><text x="106" y="607" font-size="29" fill="#173c42" font-weight="bold">介護が必要になった</text><path d="M755 577 H842" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><rect x="865" y="519" width="670" height="116" rx="18" fill="#e7ecdf"/><text x="895" y="566" font-size="30" fill="#63815a" font-weight="bold">介護保険</text><text x="895" y="607" font-size="25" fill="#173c42" >介護サービスなどを支える</text><rect x="65" y="655" width="670" height="116" rx="18" fill="#fff"/><rect x="65" y="655" width="8" height="116" rx="4" fill="#b47c36"/><text x="106" y="700" font-size="19" fill="#b47c36" >働く人のリスク</text><text x="106" y="743" font-size="29" fill="#173c42" font-weight="bold">失業 ／ 仕事・通勤によるけが</text><path d="M755 713 H842" fill="none" stroke="#267e83" stroke-width="5" marker-end="url(#arrow)"/><rect x="865" y="655" width="670" height="116" rx="18" fill="#f3e7d4"/><text x="895" y="702" font-size="30" fill="#b47c36" font-weight="bold">労働保険</text><text x="895" y="743" font-size="25" fill="#173c42" >雇用保険　／　労災保険</text><text x="65" y="862" font-size="18" fill="#627373" >主な場面の例です。各保険の給付には対象・条件があり、この図だけで受給可否は判断できません。</text><text x="1535" y="862" font-size="20" fill="#267e83" text-anchor="end">03</text></g></svg>
